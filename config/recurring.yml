# Solid Queue recurring tasks. The weekly crawl runs Monday morning, so the
# report covers a full Monday-to-Sunday week.
weekly_ingest: &weekly_ingest
  class: IngestWeekJob
  queue: default
  schedule: every monday at 6am

development:
  weekly_ingest: *weekly_ingest

production:
  weekly_ingest: *weekly_ingest
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
